<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>安全第一むじなグループ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    font-family: "Noto Sans JP", sans-serif;
    background: #ffffff;
    overflow-x: hidden;
  }

  /* 1枚目：フルスクリーン・水背景 */
  .screen1 {
    position: relative;
    height: 100vh;
    background-image: url("water-hero.jpg");
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  .screen1::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
  }
  .screen1-inner {
    position: relative;
    z-index: 1;
    color: #fff;
  }
  .hero-title {
    font-size: 46px;
    letter-spacing: 0.18em;
    opacity: 0;
    transform: translateY(30px);
    transition: 1s ease;
  }

  /* 2枚目：左右レイアウト＋ふわっと上がる */
  .screen2 {
    position: relative;
    height: 100vh;
    background-image: url("water-second.jpg");
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }
  .screen2::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,40,80,0.35);
  }
  .screen2-inner {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10vw;
    height: 100%;
    color: #fff;
  }
  .screen2-left,
  .screen2-right {
    opacity: 0;
    transform: translateY(40px);
    transition: 1.2s ease;
  }
  .screen2-left {
    max-width: 40%;
    font-size: 24px;
    letter-spacing: 0.15em;
  }
  .screen2-right img {
    max-width: 420px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  /* 3枚目：スクロールで限定領域に文字 */
  .screen3-wrapper {
    min-height: 120vh;
    background: linear-gradient(to bottom, #e9f6ff, #ffffff);
    padding: 80px 0;
  }
  .screen3-fixed {
    position: sticky;
    top: 20vh;
    margin: 0 auto;
    max-width: 600px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 40px 30px;
    text-align: center;
    opacity: 0;
    transform: translateY(30px);
    transition: 0.8s ease;
  }
</style>
</head>
<body>

<!-- 1枚目 -->
<div class="screen1" id="screen1">
  <div class="screen1-inner">
    <div class="hero-title" id="heroTitle">むじなグループ</div>
  </div>
</div>

<!-- 2枚目 -->
<div class="screen2" id="screen2">
  <div class="screen2-inner">
    <div class="screen2-left" id="screen2Left">
      安全第一むじなグループ<br>
      <span style="font-size:14px; letter-spacing:0.08em;">
        人と自然と響きあい、豊かな生活文化をめざします。
      </span>
    </div>
    <div class="screen2-right" id="screen2Right">
      <!-- ここに殿堂系の画像スライドショーなどを入れられる -->
      <img src="image1.jpg" alt="イメージ画像">
    </div>
  </div>
</div>

<!-- 3枚目：スクロールで限定領域に文章 -->
<div class="screen3-wrapper">
  <div class="screen3-fixed" id="screen3Fixed">
    安全を第一に活動しています。<br><br>
    【無理のない範囲で、落ち着いて選びましょう】<br><br>
    ここに理念やメッセージを載せて、  
    スクロールしてもこの箱だけが見える構成にできます。
  </div>
</div>

<script>
  // 1枚目：表示＆1秒後に2枚目へスクロール
  window.addEventListener("load", () => {
    const title = document.getElementById("heroTitle");
    title.style.opacity = 1;
    title.style.transform = "translateY(0)";

    setTimeout(() => {
      document.getElementById("screen2").scrollIntoView({ behavior: "smooth" });
    }, 1000);
  });

  // 2枚目：ふわっと上がる
  window.addEventListener("scroll", () => {
    const left = document.getElementById("screen2Left");
    const right = document.getElementById("screen2Right");
    const fixed = document.getElementById("screen3Fixed");

    const lh = left.getBoundingClientRect().top;
    const rh = right.getBoundingClientRect().top;
    const fh = fixed.getBoundingClientRect().top;

    if (lh < window.innerHeight - 100) {
      left.style.opacity = 1;
      left.style.transform = "translateY(0)";
    }
    if (rh < window.innerHeight - 100) {
      right.style.opacity = 1;
      right.style.transform = "translateY(0)";
    }
    if (fh < window.innerHeight - 150) {
      fixed.style.opacity = 1;
      fixed.style.transform = "translateY(0)";
    }
  });
</script>

</body>
</html>
